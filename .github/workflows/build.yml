name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Ekstrak project
        run: |
          unzip -q project.zip -d src
          echo "DIR=$(dirname "$(find src -name settings.gradle | head -1)")" >> $GITHUB_ENV
      - name: Build
        run: cd "$DIR" && gradle assembleDebug --no-daemon --stacktrace
      - name: Siapkan APK
        run: cp "$DIR/app/build/outputs/apk/debug/app-debug.apk" KawaiiMusic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KawaiiMusic-apk
          path: KawaiiMusic.apk
      - name: Rilis (unduh APK langsung dari tab Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" KawaiiMusic.apk --title "Kawaii Music build ${{ github.run_number }}" --notes "APK debug"
